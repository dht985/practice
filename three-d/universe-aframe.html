<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星球宇宙 · A-Frame</title>
  <script src="libs/aframe.min.js"></script>
  <script>
  // ============================================================
  // 三个自定义组件：声明式标签不够用时，用组件扩展
  // ============================================================

  // 固定随机数，每次刷新星空与小行星布局一致
  function afMakeRandom(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  // ---- 星空：球壳内随机分布的 Points 粒子 ----
  AFRAME.registerComponent('starfield', {
    schema: { count: { default: 1600 } },
    init: function () {
      var T = window.THREE, rnd = afMakeRandom(606), n = this.data.count;
      var pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
      var palette = [new T.Color(0xffffff), new T.Color(0xcfe0ff), new T.Color(0xffe8c0)];
      for (var i = 0; i < n; i++) {
        var r = 60 + rnd() * 90;
        var theta = rnd() * Math.PI * 2;
        var phi = Math.acos(2 * rnd() - 1);
        pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.cos(phi);
        pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        var c = palette[(rnd() * palette.length) | 0];
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      }
      var geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(pos, 3));
      geo.setAttribute('color', new T.BufferAttribute(col, 3));
      var mat = new T.PointsMaterial({
        size: 0.55, vertexColors: true, transparent: true, opacity: 0.95,
        sizeAttenuation: true, depthWrite: false
      });
      this.el.setObject3D('points', new T.Points(geo, mat));
    }
  });

  // ---- 小行星带：InstancedMesh 一次绘制 260 个四面体岩石 ----
  AFRAME.registerComponent('asteroid-belt', {
    schema: { count: { default: 260 }, rMin: { default: 8.4 }, rMax: { default: 9.5 } },
    init: function () {
      var T = window.THREE, rnd = afMakeRandom(707), n = this.data.count;
      var inst = new T.InstancedMesh(
        new T.TetrahedronGeometry(0.09, 0),
        new T.MeshStandardMaterial({ color: 0x756b5f, roughness: 1 }),
        n
      );
      var dummy = new T.Object3D();
      for (var i = 0; i < n; i++) {
        var rr = this.data.rMin + rnd() * (this.data.rMax - this.data.rMin);
        var a = rnd() * Math.PI * 2;
        dummy.position.set(Math.cos(a) * rr, (rnd() - 0.5) * 0.5, Math.sin(a) * rr);
        dummy.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6);
        var s = 0.5 + rnd() * 1.3;
        dummy.scale.set(s, s, s);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
      this.el.setObject3D('mesh', inst);
    }
  });

  // ---- 太阳辉光：径向渐变 Sprite，加法混合 ----
  AFRAME.registerComponent('sun-glow', {
    schema: { size: { default: 5.6 } },
    init: function () {
      var T = window.THREE;
      var c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(128, 128, 4, 128, 128, 256 * 0.46);
      grd.addColorStop(0, 'rgba(255,228,160,.85)');
      grd.addColorStop(0.18, 'rgba(255,190,90,.32)');
      grd.addColorStop(0.45, 'rgba(255,160,60,.08)');
      grd.addColorStop(1, 'rgba(255,150,40,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 256, 256);
      var mat = new T.SpriteMaterial({
        map: new T.CanvasTexture(c), transparent: true,
        blending: T.AdditiveBlending, depthWrite: false
      });
      var sprite = new T.Sprite(mat);
      sprite.scale.set(this.data.size, this.data.size, 1);
      this.el.setObject3D('sprite', sprite);
    }
  });
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #hud {
      position: fixed; top: 22px; left: 24px; z-index: 99;
      padding: 16px 20px; border-radius: 14px;
      background: rgba(12, 18, 38, 0.72);
      border: 1px solid rgba(140, 160, 220, 0.25);
      color: #eef2ff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      pointer-events: none; user-select: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    #hud h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; letter-spacing: 1px; }
    #hud .tag {
      display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 8px;
      font-size: 12px; color: #20263a; background: #e1b99f; vertical-align: 2px;
    }
    #hud p { margin: 0; font-size: 13px; color: #a9b4d6; line-height: 1.7; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>🪐 星球宇宙 <span class="tag">A-Frame 1.8 声明式</span></h1>
    <p>鼠标拖拽环视 · WASD 键在太阳系中漫游</p>
    <p>太阳 · 地球与月球 · 火星 · 土星环 · 小行星带 · 星空</p>
  </div>

  <a-scene renderer="antialias: true; colorManagement: false" background="color: #05060f">
    <!-- 环境：深色太空天穹 -->
    <a-sky color="#05060f"></a-sky>

    <!-- 光源：环境光 + 太阳处点光源 -->
    <a-light type="ambient" color="#8899bb" intensity="0.5"></a-light>
    <a-light type="point" position="0 0 0" color="#fff1d0" intensity="2.2" distance="0" decay="0"></a-light>

    <!-- 太阳（flat 材质自发光）+ 辉光 Sprite -->
    <a-sphere radius="2" material="shader: flat; color: #ffb020"></a-sphere>
    <a-entity sun-glow="size: 5.6"></a-entity>

    <!-- 轨道线：细环平铺在 XZ 平面（RingGeometry） -->
    <a-ring radius-inner="4.97" radius-outer="5.03" rotation="-90 0 0"
            material="shader: flat; color: #5f6f9e; opacity: 0.4; transparent: true; side: double"></a-ring>
    <a-ring radius-inner="7.37" radius-outer="7.43" rotation="-90 0 0"
            material="shader: flat; color: #5f6f9e; opacity: 0.4; transparent: true; side: double"></a-ring>
    <a-ring radius-inner="10.37" radius-outer="10.43" rotation="-90 0 0"
            material="shader: flat; color: #5f6f9e; opacity: 0.4; transparent: true; side: double"></a-ring>

    <!-- ============ 地球系统：公转 pivot → 轨道偏移 holder → 自转球 → 月球 ============ -->
    <a-entity rotation="0 350 0"
              animation="property: rotation; to: 0 710 0; dur: 60000; loop: true; easing: linear">
      <a-entity position="5 0 0">
        <a-sphere radius="0.6" color="#3a7bd5"
                  animation="property: rotation; to: 0 360 0; dur: 5200; loop: true; easing: linear"></a-sphere>
        <a-entity animation="property: rotation; to: 0 360 0; dur: 3900; loop: true; easing: linear">
          <a-sphere position="1.3 0 0" radius="0.16" color="#b4b4b4"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ============ 火星 ============ -->
    <a-entity rotation="0 150 0"
              animation="property: rotation; to: 0 510 0; dur: 95000; loop: true; easing: linear">
      <a-entity position="7.4 0 0">
        <a-sphere radius="0.42" color="#c16230"
                  animation="property: rotation; to: 0 360 0; dur: 6300; loop: true; easing: linear"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- ============ 土星：球体 + 倾斜组内三层光环 ============ -->
    <a-entity rotation="0 112 0"
              animation="property: rotation; to: 0 472 0; dur: 140000; loop: true; easing: linear">
      <a-entity position="10.4 0 0">
        <a-entity rotation="24 0 0">
          <a-sphere radius="1.05" color="#d9bd8a"
                    animation="property: rotation; to: 0 360 0; dur: 7800; loop: true; easing: linear"></a-sphere>
          <a-ring radius-inner="1.35" radius-outer="1.55" rotation="-90 0 0"
                  material="color: #cbbf96; opacity: 0.7; transparent: true; side: double"></a-ring>
          <a-ring radius-inner="1.62" radius-outer="1.95" rotation="-90 0 0"
                  material="color: #b3a277; opacity: 0.5; transparent: true; side: double"></a-ring>
          <a-ring radius-inner="2.02" radius-outer="2.25" rotation="-90 0 0"
                  material="color: #9c8d66; opacity: 0.3; transparent: true; side: double"></a-ring>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ============ 小行星带（自定义组件），整体缓慢公转 ============ -->
    <a-entity asteroid-belt="count: 260"
              animation="property: rotation; to: 0 360 0; dur: 105000; loop: true; easing: linear"></a-entity>

    <!-- ============ 星空背景（自定义组件） ============ -->
    <a-entity starfield="count: 1600"></a-entity>

    <!-- 相机层级：rig(位置+WASD水平移动) → pitch(固定25°俯角) → camera(look-controls拖拽环视) -->
    <a-entity id="camera-rig" position="0 8.5 18.5" wasd-controls="acceleration: 35">
      <a-entity rotation="-25 0 0">
        <a-entity camera="fov: 45; near: 0.1; far: 300" look-controls></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
